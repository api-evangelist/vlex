description: vLex sells legal research and AI products (Vincent, vLex Library, Docket Alarm,
  vLex Labs, Fastcase Library) under custom pricing. The public site exposes "Book a demo" and
  "Start a free trial" CTAs but no published rate card or API price list; commercial terms are
  negotiated per organization.
