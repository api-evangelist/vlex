specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: vLex
providerId: vlex
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Legal
  - Legal Research
  - Legal AI
description: vLex does not publish a public rate-limit table for its API products. Throughput is
  set in the API license agreement and varies by product (Vincent AI, vLex Library, Docket Alarm,
  Fastcase Library) and contract tier.
sources:
  - https://vlex.com/products
responseCodes:
  throttled: 429
limits:
  - name: License-defined
    scope: contract
    metric: varies
    limit: governed by the API license / subscription agreement; not publicly published
policies:
  - name: Contractual scoping
    description: Per-key and per-account throughput, query allowances, and document-download caps
      are negotiated in the API license; consumers should reference their agreement for concrete
      thresholds.
  - name: Backoff
    description: On 429 responses, implement exponential backoff with jitter and respect any
      Retry-After header.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
