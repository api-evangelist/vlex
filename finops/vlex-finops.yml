description: FOCUS-aligned FinOps shape for vLex. Pricing is custom-quoted per organization and
  product; meters cover the canonical billable units on a vLex contract (seats and metered AI
  queries / document operations) without inventing public unit prices.
sources:
  - https://vlex.com/products
notes: No public unit prices were available; commercial terms are negotiated through vLex sales.
billingModel:
  pricingCategory: Subscription + Custom Terms
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
focusColumns:
  ServiceName: vLex
  ServiceCategory: Legal Research / Legal AI
  ProviderName: vLex
  PublisherName: vLex Justis
  BillingCurrency: USD
meters:
  - name: seats
    unit: seat
    aggregation: max
    dimensions:
      - product
  - name: ai_queries
    unit: query
    aggregation: sum
    dimensions:
      - product
  - name: document_views
    unit: document
    aggregation: sum
    dimensions:
      - product
principles:
  - name: Visibility
    description: Visibility is delivered through the vLex admin console (per-seat usage, query
      counts) and the contracted reporting cadence; there is no FOCUS export.
  - name: Allocation
    description: Allocate seat and query consumption to practice groups / matter codes via the
      organization mapping in the vLex admin console.
  - name: Optimization
    description: Levers are seat right-sizing across practice groups, retiring inactive accounts,
      and selecting the product mix (Vincent vs Library vs Docket Alarm) that matches actual use.
  - name: Accountability
    description: Knowledge management / library services typically owns the vLex contract;
      finance reconciles annually against the contracted seat count and any metered overages.
maintainers:
